[package]
name = "daymark"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A quiet, local-only desktop journal built with Freya"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
directories = "6.0"
freya = { version = "=0.5.0-rc.13", features = ["icons-lucide"] }
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
freya-testing = "=0.5.0-rc.13"
tempfile = "3.27"

[profile.dev]
debug = 0

[profile.test]
debug = 0
